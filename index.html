<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zivo: Free Invoice Generator for Freelancers in India</title>
<meta name="description" content="Zivo is a free invoice generator for freelancers in India. Create GST invoices, save clients, add UPI or bank details, and track paid and overdue invoices.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --bg: #f8fafc; --surface: #ffffff; --ink: #0f172a; --muted: #52607a; --line: #e2e8f0; --field: #f1f5f9;
  --primary: #2563eb; --primary-ink: #ffffff; --link: #1d4ed8;
  --mint: #2dd4bf; --mint-ink: #042f2a; --danger: #b4282e;
  --pill-draft-bg: #e8ecf2; --pill-draft-ink: #3b475c;
  --pill-sent-bg: #dce8ff; --pill-sent-ink: #1b4fc4;
  --pill-overdue-bg: #ffe1e2; --pill-overdue-ink: #a12127;
  --pill-paid-bg: #cff7f0; --pill-paid-ink: #0b5f54;
  --glow1: rgba(37,99,235,.15); --glow2: rgba(45,212,191,.18);
  --font: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1220; --surface: #131c2e; --ink: #e8eefb; --muted: #9aa8c2; --line: #25324a; --field: #0e1626;
    --link: #8fb2ff; --danger: #ff9a9e;
    --pill-draft-bg: #2a3446; --pill-draft-ink: #c3cde0;
    --pill-sent-bg: #1c2f57; --pill-sent-ink: #a9c5ff;
    --pill-overdue-bg: #4a1f24; --pill-overdue-ink: #ffb8bb;
    --pill-paid-bg: #0f3d38; --pill-paid-ink: #84f2df;
    --glow1: rgba(37,99,235,.28); --glow2: rgba(45,212,191,.16);
  }
}
:root[data-theme="dark"] {
  --bg: #0b1220; --surface: #131c2e; --ink: #e8eefb; --muted: #9aa8c2; --line: #25324a; --field: #0e1626;
  --link: #8fb2ff; --danger: #ff9a9e;
  --pill-draft-bg: #2a3446; --pill-draft-ink: #c3cde0;
  --pill-sent-bg: #1c2f57; --pill-sent-ink: #a9c5ff;
  --pill-overdue-bg: #4a1f24; --pill-overdue-ink: #ffb8bb;
  --pill-paid-bg: #0f3d38; --pill-paid-ink: #84f2df;
  --glow1: rgba(37,99,235,.28); --glow2: rgba(45,212,191,.16);
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0; color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.5;
  background:
    radial-gradient(55% 380px at 12% 0%, var(--glow1), transparent 70%),
    radial-gradient(45% 340px at 92% 0%, var(--glow2), transparent 70%),
    var(--bg);
  background-repeat: no-repeat;
  min-height: 100%;
}
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
.ic { display: inline-flex; vertical-align: middle; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.pre { white-space: pre-line; overflow-wrap: anywhere; }
.empty { color: #8a96ab; }

/* header */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.top-in { max-width: 1180px; margin: 0 auto; padding: 10px 20px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; background: none; border: 0; cursor: pointer; font-weight: 800; font-size: 18px; letter-spacing: -0.02em; padding: 4px 0; }
.mark { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; color: #fff; background: linear-gradient(135deg, #2563eb, #2dd4bf); }
.nav { display: flex; gap: 4px; margin-left: 8px; }
.nav button { background: none; border: 0; border-radius: 8px; padding: 8px 12px; cursor: pointer; font-weight: 600; color: var(--muted); }
.nav button:hover { color: var(--ink); background: var(--field); }
.nav button[aria-current="page"] { color: var(--ink); background: var(--field); }
.top-right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.icon-btn { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; display: grid; place-items: center; }
.icon-btn:hover { border-color: var(--muted); }

/* buttons */
.btn { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 16px; cursor: pointer; font-weight: 700; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }
.btn.primary:hover { background: #1d4fd0; }
.btn.mint { background: var(--mint); border-color: var(--mint); color: var(--mint-ink); }
.btn.mint:hover { background: #22c1ae; }
.btn.small { padding: 7px 11px; font-size: 13px; border-radius: 9px; }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--danger); }
.btn.armed { background: var(--pill-overdue-bg); border-color: var(--danger); }

/* layout */
.app { max-width: 1180px; margin: 0 auto; padding: 28px 20px 70px; }
h1 { font-size: 28px; line-height: 1.15; letter-spacing: -0.025em; margin: 0; font-weight: 800; }
.sub { color: var(--muted); margin: 6px 0 0; }
.page-head { display: flex; justify-content: space-between; gap: 16px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 22px; }

/* pills */
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 4px 11px 4px 9px; font-size: 13px; font-weight: 700; white-space: nowrap; }
.pill-draft { background: var(--pill-draft-bg); color: var(--pill-draft-ink); }
.pill-sent { background: var(--pill-sent-bg); color: var(--pill-sent-ink); }
.pill-overdue { background: var(--pill-overdue-bg); color: var(--pill-overdue-ink); }
.pill-paid { background: var(--pill-paid-bg); color: var(--pill-paid-ink); }

/* reminders */
.reminder { border-radius: 14px; padding: 14px 16px; margin-bottom: 18px; border: 1px solid var(--line); background: var(--surface); display: flex; gap: 12px; align-items: flex-start; }
.reminder.bad { background: var(--pill-overdue-bg); border-color: transparent; color: var(--pill-overdue-ink); }
.reminder.soon { background: var(--pill-sent-bg); border-color: transparent; color: var(--pill-sent-ink); }
.reminder ul { margin: 0; padding: 0; list-style: none; }
.reminder li { font-weight: 600; }
.reminder .rtitle { font-weight: 800; margin-bottom: 2px; }

/* stat cards */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px; margin-bottom: 26px; }
.stat { border-radius: 18px; padding: 18px 20px; border: 1px solid var(--line); }
.stat .lbl { font-weight: 600; color: var(--muted); font-size: 14px; }
.stat .val { font-size: 30px; font-weight: 800; letter-spacing: -0.03em; margin-top: 4px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.stat .note { font-size: 13px; color: var(--muted); margin-top: 2px; }
.stat.s1 { background: linear-gradient(135deg, rgba(45,212,191,.28), rgba(37,99,235,.10)), var(--surface); }
.stat.s2 { background: linear-gradient(135deg, rgba(37,99,235,.24), rgba(124,92,255,.10)), var(--surface); }
.stat.s3 { background: linear-gradient(135deg, rgba(240,82,82,.20), rgba(251,146,60,.10)), var(--surface); }

/* filters + list */
.filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 14px; cursor: pointer; font-weight: 600; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.list { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.inv-row {
  display: grid; align-items: center; gap: 12px 16px; padding: 14px 18px; border-top: 1px solid var(--line);
  grid-template-columns: minmax(0, 1.5fr) minmax(0, 1.1fr) minmax(0, 1fr) auto auto;
  grid-template-areas: "info due amount pill actions";
}
.inv-row:first-child { border-top: 0; }
.r-info { grid-area: info; min-width: 0; }
.r-due { grid-area: due; min-width: 0; }
.r-amount { grid-area: amount; text-align: right; font-weight: 800; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.r-pill { grid-area: pill; }
.r-actions { grid-area: actions; display: flex; gap: 6px; justify-content: flex-end; }
.r-num { font-weight: 800; }
.r-client { color: var(--muted); overflow-wrap: anywhere; }
.r-due .m { font-weight: 600; }
.r-due .s { color: var(--muted); font-size: 13px; }
.linkish { background: none; border: 0; padding: 0; cursor: pointer; text-align: left; font-weight: 800; color: var(--ink); }
.linkish:hover { color: var(--link); text-decoration: underline; }
.blank { padding: 44px 20px; text-align: center; }
.blank h2 { margin: 0 0 6px; font-size: 20px; }
.blank p { margin: 0 0 18px; color: var(--muted); }
.footnote { margin-top: 18px; color: var(--muted); font-size: 13px; }

/* forms */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 22px; }
.panel h2 { font-size: 16px; margin: 26px 0 12px; padding-top: 22px; border-top: 1px solid var(--line); font-weight: 800; }
.panel h2:first-child { margin-top: 0; padding-top: 0; border-top: 0; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.f { display: block; margin-bottom: 12px; }
.fl { display: block; font-size: 13px; font-weight: 600; color: var(--muted); }
.hint { display: block; font-size: 12px; color: var(--muted); margin-top: 3px; }
input:not([type="file"]), select, textarea {
  display: block; width: 100%; margin-top: 5px; padding: 10px 12px; border-radius: 10px;
  background: var(--field); border: 1px solid var(--line);
}
textarea { resize: vertical; min-height: 70px; }
.item { border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 10px; background: var(--field); }
.item input { background: var(--surface); }
.item .f { margin-bottom: 0; }
.item .r3 { display: grid; grid-template-columns: 1fr 1fr auto; gap: 10px; align-items: end; margin-top: 10px; }
.item .amt { font-weight: 800; padding-bottom: 10px; text-align: right; min-width: 90px; font-variant-numeric: tabular-nums; }
.item .rm { background: none; border: 0; color: var(--danger); cursor: pointer; font-size: 13px; font-weight: 600; padding: 8px 0 0; }
.logo-box { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
.logo-prev { width: 96px; height: 96px; border-radius: 14px; border: 1px dashed var(--muted); display: grid; place-items: center; overflow: hidden; background: #fff; color: #7a869b; font-size: 12px; text-align: center; padding: 6px; }
.logo-prev img { max-width: 100%; max-height: 100%; object-fit: contain; }
.saved { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 600; color: var(--pill-paid-ink); min-height: 22px; }
.saved.bad { color: var(--danger); }
.saved.idle { color: var(--muted); font-weight: 500; }

/* editor */
.ed-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.ed-head .spacer { flex: 1; }
.ed-grid { display: grid; grid-template-columns: minmax(320px, 450px) minmax(0, 1fr); gap: 24px; align-items: start; }
.pv-col { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 70px); min-width: 0; }
.pv-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }

/* the invoice paper: calm, mostly black and white */
.paper {
  background: #ffffff; color: #111827; border-radius: 6px; padding: 44px; min-height: 640px; font-size: 13.5px;
  box-shadow: 0 1px 2px rgba(15,23,42,.10), 0 14px 40px rgba(15,23,42,.14);
}
.pp-head { display: flex; justify-content: space-between; gap: 24px; align-items: flex-start; }
.pp-brand { display: flex; gap: 14px; align-items: flex-start; min-width: 0; }
.pp-logo { max-height: 60px; max-width: 150px; object-fit: contain; display: block; }
.pp-biz { font-weight: 800; font-size: 19px; letter-spacing: -0.02em; overflow-wrap: anywhere; }
.pp-tag { color: #566174; font-size: 12.5px; }
.pp-from { color: #566174; font-size: 12.5px; margin-top: 8px; max-width: 280px; }
.pp-title { text-align: right; flex-shrink: 0; }
.pp-title .word { font-size: 28px; font-weight: 800; letter-spacing: 0.02em; }
.pp-num { color: #566174; font-weight: 600; }
.paid-mark { display: inline-block; margin-top: 6px; border: 2px solid #0b7a6c; color: #0b7a6c; font-weight: 800; padding: 1px 10px; border-radius: 6px; letter-spacing: 0.08em; }
.pp-rule { height: 3px; background: #2563eb; margin: 24px 0; border-radius: 2px; }
.pp-meta { display: grid; grid-template-columns: 1.6fr 1fr 1fr; gap: 20px; margin-bottom: 26px; }
.pp-meta .k { font-size: 12px; font-weight: 700; color: #566174; margin-bottom: 3px; }
.pp-meta .strong { font-weight: 700; font-size: 14.5px; overflow-wrap: anywhere; }
.pp-scroll { overflow-x: auto; }
.pp-table { width: 100%; border-collapse: collapse; }
.pp-table th { text-align: left; font-size: 12px; color: #566174; font-weight: 700; padding: 8px 6px; border-bottom: 2px solid #111827; }
.pp-table td { padding: 11px 6px; border-bottom: 1px solid #e5e9f0; vertical-align: top; overflow-wrap: anywhere; }
.pp-table .n { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.pp-totals { margin: 16px 0 0 auto; width: min(300px, 100%); }
.pp-totals .l { display: flex; justify-content: space-between; padding: 4px 6px; font-variant-numeric: tabular-nums; }
.pp-due { margin-top: 10px; border-top: 2px solid #111827; padding: 12px 6px 0; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.pp-due .k { font-weight: 700; color: #566174; }
.pp-due .v { font-size: 30px; font-weight: 800; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.pp-foot { margin-top: 32px; display: grid; gap: 18px; }
.pp-foot .k { font-size: 12px; font-weight: 700; color: #566174; margin-bottom: 3px; }
.pp-dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 14px; }
.pp-dl dt { color: #566174; }
.pp-dl dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; }

/* auth */
.auth { max-width: 980px; margin: 0 auto; display: grid; grid-template-columns: 1.1fr 1fr; gap: 48px; align-items: center; padding-top: 24px; }
.auth h1 { font-size: 40px; line-height: 1.1; letter-spacing: -0.03em; }
.auth .lead { color: var(--muted); font-size: 17px; margin: 14px 0 20px; max-width: 460px; }
.auth ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; font-weight: 600; }
.auth li { display: flex; gap: 8px; align-items: center; }
.auth li .ic { color: var(--pill-paid-ink); }
.auth-card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 26px; }
.auth-card h2 { margin: 0 0 16px; font-size: 22px; letter-spacing: -0.02em; }
.auth-card .btn { width: 100%; justify-content: center; margin-top: 6px; }
.auth-switch { margin: 16px 0 0; text-align: center; color: var(--muted); }
.auth-switch button { background: none; border: 0; padding: 0; cursor: pointer; font-weight: 700; color: var(--link); }
.msg { border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; font-weight: 600; font-size: 14px; }
.msg.err { background: var(--pill-overdue-bg); color: var(--pill-overdue-ink); }
.msg.ok { background: var(--pill-paid-bg); color: var(--pill-paid-ink); }
.showpw { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); margin: 0 0 8px; }
.showpw input { width: auto; margin: 0; }
.center-note { text-align: center; padding: 80px 20px; color: var(--muted); }
.center-note h2 { color: var(--ink); margin: 0 0 8px; }
.who { font-size: 13px; color: var(--muted); max-width: 190px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
@media (max-width: 860px) { .auth { grid-template-columns: 1fr; gap: 28px; } .auth h1 { font-size: 32px; } .who { display: none !important; } }

/* toast + confetti */
#toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 11px 18px; border-radius: 12px; font-weight: 600; z-index: 50; max-width: 90vw; opacity: 0; pointer-events: none; transition: opacity .2s; }
#toast.show { opacity: 1; }
.confetti { position: fixed; inset: 0; z-index: 60; pointer-events: none; }
@media (prefers-reduced-motion: reduce) { #toast { transition: none; } }

@media (max-width: 900px) {
  .ed-grid { grid-template-columns: 1fr; }
  .pv-col { position: static; }
}
@media (max-width: 720px) {
  .app { padding: 20px 14px 60px; }
  .inv-row { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "info amount" "due pill" "actions actions"; }
  .r-actions { justify-content: flex-start; }
  .paper { padding: 24px 18px; }
  .pp-head { flex-direction: column; }
  .pp-title { text-align: left; }
  .pp-meta { grid-template-columns: 1fr 1fr; }
  .pp-meta > div:first-child { grid-column: 1 / -1; }
  .nav { order: 3; width: 100%; margin-left: 0; }
}

@media print {
  :root { padding: 0; }
  body { background: #fff; }
  .top, .ed-head, .panel, .pv-actions, #toast { display: none !important; }
  .app { padding: 0; max-width: none; }
  .ed-grid { display: block; }
  .pv-col { position: static; }
  .paper { box-shadow: none; border-radius: 0; padding: 0; min-height: 0; }
  .empty { color: #111827; }
}
</style>

    var received = invs.filter(function (i) { return i.status === "paid" && (i.paidAt || "").slice(0, 7) === monthKey; });

    if (overdue.length || soon.length) {

      overdue.slice(0, 3).forEach(function (i) { ul.appendChild(h("li", { text: i.number + " for " + (i.client.name || "a client") + " is " + plural(-daysUntil(i.due), "day") + " overdue." })); });

        ul.appendChild(h("li", { text: i.number + " for " + (i.client.name || "a client") + (d === 0 ? " is due today." : d === 1 ? " is due tomorrow." : " is due in " + d + " days.") }));

    root.appendChild(h("div", { class: "stats" },

      h("div", { class: "stat s2" }, h("div", { class: "lbl", text: "Still owed to you" }), h("div", { class: "val", text: sumText(owed) }), h("div", { class: "note", text: plural(owed.length, "unpaid invoice") })),
      h("div", { class: "stat s3" }, h("div", { class: "lbl", text: "Overdue" }), h("div", { class: "val", text: sumText(overdue) }), h("div", { class: "note", text: plural(overdue.length, "late invoice") }))));

    var counts = { all: invs.length, draft: 0, sent: 0, overdue: 0, paid: 0 };

      var armed = false, timer;
      del.addEventListener("click", function () {
        if (!armed) {
          armed = true; del.textContent = "Click again to delete"; del.classList.add("armed");
          timer = setTimeout(function () { armed = false; del.textContent = ""; del.appendChild(icon("trash", 15)); del.classList.remove("armed"); }, 3000);
        } else {
          clearTimeout(timer);
          removeInvoice(inv); renderDash();

      });
      var actions = h("div", { class: "r-actions" },
        h("button", { class: "btn small", type: "button", onclick: function () { go("edit", inv.id); } }, "Open"),
        (st === "sent" || st === "overdue") ? h("button", { class: "btn small mint", type: "button", onclick: function () { markPaid(inv); renderDash(); } }, icon("check", 15), "Mark paid") : null,
        del);
      list.appendChild(h("div", { class: "inv-row" },
        h("div", { class: "r-info" },
          h("button", { class: "linkish r-num", type: "button", onclick: function () { go("edit", inv.id); }, text: inv.number || "Invoice" }),
          h("div", { class: "r-client", text: inv.client.name || "No client yet" })),
        h("div", { class: "r-due" }, h("div", { class: "m", text: di.m }), h("div", { class: "s", text: di.s })),
        h("div", { class: "r-amount", text: money(totals(inv).total, inv.currency) }),
        h("div", { class: "r-pill" }, pill(st)),
        actions));
    });
    root.appendChild(list);
    root.appendChild(h("p", { class: "footnote", text: "Your invoices are saved to your account, so you can open them on any device." }));
  }

  /* ---------- editor ---------- */
  function newAndOpen() { var inv = createInvoice(); view = view === "edit" ? "edit" : view; go("edit", inv.id); }

  function renderEditor() {
    var inv = getInv(currentId);
    if (!inv) { view = "dash"; render(); return; }
    var root = $("#app"); root.textContent = "";
    var paper = h("article", { class: "paper", "aria-label": "Invoice preview" });

    var pillHost = h("span"), actionHost = h("div", { class: "pv-actions" });

    function updatePreview() { title.textContent = inv.number || "Invoice"; renderPaper(inv, paper); }
    function changed() { scheduleInvoice(inv); updatePreview(); }

    function refreshStatus() {
      var st = effStatus(inv);
      pillHost.textContent = ""; pillHost.appendChild(pill(st));
      actionHost.textContent = "";
      actionHost.appendChild(h("button", { class: "btn", type: "button", onclick: function () { window.print(); } }, icon("download", 16), "Download PDF"));
      if (inv.status === "draft") {
        actionHost.appendChild(h("button", { class: "btn primary", type: "button", onclick: function () {
          if (!inv.client.name.trim()) { toast("Add a client name before marking as sent."); return; }
          if (totals(inv).total <= 0) { toast("Add at least one item with a rate first."); return; }
          upsertClient(inv); inv.status = "sent"; saveInvoiceNow(inv); refreshStatus(); updatePreview(); toast("Marked as sent. Send the PDF to your client.");
        } }, icon("send", 16), "Mark as sent"));
      } else if (inv.status === "sent") {
        actionHost.appendChild(h("button", { class: "btn mint", type: "button", onclick: function () { markPaid(inv); refreshStatus(); updatePreview(); } }, icon("check", 16), "Mark as paid"));

    root.appendChild(h("div", { class: "ed-head" },

    /* client with saved-client suggestions */

    var itemsBox = h("div");
    function drawItems() {
      itemsBox.textContent = "";
      inv.items.forEach(function (it, i) {
        var amt = h("div", { class: "amt" });
        function setAmt() { amt.textContent = money(num(it.q) * num(it.r), inv.currency); }

          field("Description", inp(it, "d", changed, { placeholder: "Logo design" })),

            field("Rate", inp(it, "r", function () { setAmt(); changed(); }, { type: "number", min: "0", step: "any", inputmode: "decimal", placeholder: "0" })),
            amt),
          inv.items.length > 1 ? h("button", { class: "rm", type: "button", onclick: function () { inv.items.splice(i, 1); drawItems(); changed(); } }, "Remove item") : null);
        itemsBox.appendChild(node);
      });
    }
    drawItems();

    var form = h("section", { class: "panel", "aria-label": "Invoice details" },
      h("h2", { text: "Client" }),
      field("Client name", nameEl, store.clients.length ? "Pick a saved client from the list to fill their details." : "Clients you use are saved for next time."),
      dl,
      field("Client details", detailsEl),
      h("h2", { text: "Invoice" }),
      h("div", { class: "row2" },
        field("Invoice number", inp(inv, "number", changed)),
        field("Currency", selectEl(CURRENCIES, inv.currency, function (v) { inv.currency = v; drawItems(); changed(); }))),
      h("div", { class: "row2" },
        field("Issue date", inp(inv, "issue", changed, { type: "date" })),
        field("Due date", inp(inv, "due", function () { changed(); refreshStatus(); }, { type: "date" }))),
      h("h2", { text: "Items" }),
      itemsBox,
      h("button", { class: "btn small", type: "button", onclick: function () { inv.items.push({ d: "", q: 1, r: "" }); drawItems(); changed(); } }, icon("plus", 15), "Add item"),
      h("h2", { text: "GST" }),
      taxFields(inv, changed),
      h("h2", { text: "Payment details" }),

    root.appendChild(h("div", { class: "ed-grid" }, form, h("div", { class: "pv-col" }, actionHost, paper)));

  /* ---------- business profile ---------- */
  function resizeLogo(file, done) {
    if (!file || !/^image\//.test(file.type)) { toast("Choose an image file (PNG or JPG)."); return; }
    var reader = new FileReader();
    reader.onerror = function () { toast("That image could not be read."); };
    reader.onload = function () {
      var img = new Image();
      img.onerror = function () { toast("That image could not be read. Try a PNG or JPG."); };
      img.onload = function () {
        var w = img.width, hh = img.height;
        if (!w || !hh) { toast("That image could not be read. Try a PNG or JPG."); return; }
        var s = Math.min(1, 300 / Math.max(w, hh));
        w = Math.round(w * s); hh = Math.round(hh * s);
        var c = document.createElement("canvas"); c.width = w; c.height = hh;
        c.getContext("2d").drawImage(img, 0, 0, w, hh);
        var url = c.toDataURL("image/png");
        if (url.length > 220000) url = c.toDataURL("image/jpeg", 0.85);
        done(url);
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  }

    drawLogo();

    root.appendChild(h("div", { class: "page-head" },
      h("div", null, h("h1", { text: "Business profile" }), h("p", { class: "sub", text: "Filled in once, used on every invoice." })),
      savedEl()));

    root.appendChild(h("section", { class: "panel", style: "max-width:640px", "aria-label": "Business profile" },
      h("h2", { text: "Logo and name" }),
      h("div", { class: "logo-box" }, logoPrev, h("div", null,
        h("label", { class: "btn", for: "logoFile", tabindex: "0", onkeydown: function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); file.click(); } } }, "Upload logo"),
        file, h("div", { class: "hint", text: "PNG or JPG. It's shrunk automatically." }), logoBtns)),
      field("Business name", inp(p, "name", changed, { placeholder: "Asha Verma Design", autocomplete: "organization" })),
      field("Tagline (optional)", inp(p, "tagline", changed, { placeholder: "Brand design for small businesses" })),
      h("h2", { text: "Contact details" }),
      field("Address, email and phone", area(p, "details", changed, { placeholder: "12 MG Road, Pune\nasha@example.com\n+91 98765 43210" })),
      field("GSTIN (optional)", inp(p, "gstin", changed, { placeholder: "27ABCDE1234F1Z5", autocomplete: "off" })),
      h("h2", { text: "Defaults for new invoices" }),
      h("div", { class: "row2" },
        field("Currency", selectEl(CURRENCIES, p.currency, function (v) { p.currency = v; changed(); })),
        field("Days until payment is due", inp(p, "dueDays", changed, { type: "number", min: "0", step: "1", inputmode: "numeric" }))),
      taxFields(p, changed),
      payFields(p.pay, changed),
      field("Default note", area(p, "notes", changed, { placeholder: "Thank you for your business." })),
      h("button", { class: "btn primary", type: "button", onclick: function () { go("dash"); } }, "Done")));

  /* ---------- shell ---------- */
  function applyTheme() {
    if (store.theme) document.documentElement.setAttribute("data-theme", store.theme);
    else document.documentElement.removeAttribute("data-theme");
    var dark = isDark(), b = $("#themeBtn");
    b.textContent = ""; b.appendChild(icon(dark ? "sun" : "moon", 18));
    b.setAttribute("aria-label", dark ? "Switch to light mode" : "Switch to dark mode");
  }
  function isDark() {
    if (store.theme) return store.theme === "dark";
    return !!(window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
  }
  /* ---------- login / signup ---------- */
  var authMode = "login";
  function friendlyAuthError(e) {
    var m = String((e && e.message) || "").toLowerCase();
    if (m.indexOf("invalid login") >= 0) return "Wrong email or password. Please try again.";
    if (m.indexOf("already registered") >= 0 || m.indexOf("already been registered") >= 0) return "That email already has an account. Try logging in instead.";
    if (m.indexOf("not confirmed") >= 0) return "Please confirm your email first. Check your inbox for the link.";
    if (m.indexOf("rate limit") >= 0 || (e && e.status === 429)) return "Too many tries. Wait a minute and try again.";
    if (m.indexOf("password") >= 0) return "Use a password with at least 8 characters.";
    if (m.indexOf("fetch") >= 0 || m.indexOf("network") >= 0) return "Can't reach the server. Check your internet and try again.";
    return "Something went wrong: " + ((e && e.message) || "please try again.");
  }
  function renderAuth() {
    var root = $("#app"); root.textContent = "";
    var signup = authMode === "signup";
    var msg = h("div", { role: "alert", style: "display:none" });
    function show(text, ok) { msg.textContent = text; msg.className = "msg " + (ok ? "ok" : "err"); msg.style.display = ""; }
    var email = h("input", { type: "email", required: "", autocomplete: "email", placeholder: "you@example.com" });
    var pw = h("input", { type: "password", required: "", autocomplete: signup ? "new-password" : "current-password", placeholder: signup ? "At least 8 characters" : "Your password" });
    var showpw = h("input", { type: "checkbox", id: "showpw", onchange: function () { pw.type = showpw.checked ? "text" : "password"; } });
    var submit = h("button", { class: "btn primary", type: "submit" }, signup ? "Create my account" : "Log in");
    var form = h("form", { novalidate: "", onsubmit: function (e) {
      e.preventDefault();
      var em = email.value.trim(), p = pw.value;
      if (!/^\S+@\S+\.\S+$/.test(em)) { show("Enter a valid email address."); return; }
      if (signup && p.length < 8) { show("Use a password with at least 8 characters."); return; }
      if (!p) { show("Enter your password."); return; }
      submit.disabled = true; submit.textContent = signup ? "Creating account..." : "Logging in...";
      var call = signup ? sb.auth.signUp({ email: em, password: p }) : sb.auth.signInWithPassword({ email: em, password: p });
      Promise.resolve(call).then(function (res) {
        if (res.error) { show(friendlyAuthError(res.error)); }
        else if (signup && res.data && res.data.user && res.data.user.identities && res.data.user.identities.length === 0) { show("That email already has an account. Try logging in instead."); }
        else if (signup && res.data && !res.data.session) { show("Almost done! Check your email and click the confirmation link, then log in.", true); }
        if (!(res.data && res.data.session)) { submit.disabled = false; submit.textContent = signup ? "Create my account" : "Log in"; }
      }, function (err) { show(friendlyAuthError(err)); submit.disabled = false; submit.textContent = signup ? "Create my account" : "Log in"; });
    } },
      msg,
      field("Email", email),
      field("Password", pw),
      h("label", { class: "showpw", for: "showpw" }, showpw, "Show password"),
      submit);

    root.appendChild(h("div", { class: "auth" },
      h("div", null,
        h("h1", { text: "Make invoicing feel as good as getting paid." }),
        h("p", { class: "lead", text: "Create clean invoices in a minute, see who has paid, and know exactly who to follow up with." }),
        h("ul", null,
          h("li", null, icon("check", 18), "Free to start"),
          h("li", null, icon("check", 18), "Works on your phone and laptop"),
          h("li", null, icon("check", 18), "Your invoices are private to your account"))),
      h("div", { class: "auth-card" },
        h("h2", { text: signup ? "Create your account" : "Welcome back" }),
        form,
        h("p", { class: "auth-switch" }, signup ? "Already have an account? " : "New here? ",
          h("button", { type: "button", onclick: function () { authMode = signup ? "login" : "signup"; renderAuth(); } }, signup ? "Log in" : "Create an account")))));
  }
  function renderLoading() {
    var root = $("#app"); root.textContent = "";
    root.appendChild(h("div", { class: "center-note", role: "status" }, h("h2", { text: "Loading..." }), h("p", { text: "Getting your invoices ready." })));
  }
  function renderError() {
    var root = $("#app"); root.textContent = "";
    root.appendChild(h("div", { class: "center-note", role: "alert" },
      h("h2", { text: "Something went wrong" }),
      h("p", { text: errorText || "Please try again." }),
      sb && user ? h("button", { class: "btn primary", type: "button", onclick: loadAll }, "Try again")
                 : h("button", { class: "btn primary", type: "button", onclick: function () { window.location.reload(); } }, "Reload the page")));
  }

  /* ---------- shell ---------- */
  function render() {
    var authed = !!user && (view === "dash" || view === "edit" || view === "profile");
    $(".nav").style.display = authed ? "" : "none";
    $("#who").style.display = authed ? "" : "none";
    $("#who").textContent = user && user.email ? user.email : "";
    $("#logoutBtn").style.display = user ? "" : "none";
    $("#navDash").setAttribute("aria-current", view === "dash" ? "page" : "false");
    $("#navProfile").setAttribute("aria-current", view === "profile" ? "page" : "false");
    $("#newBtn").style.display = authed && view === "dash" ? "" : "none";
    if (view === "loading") renderLoading();
    else if (view === "error") renderError();
    else if (!user) renderAuth();
    else if (view === "edit") renderEditor();
    else if (view === "profile") renderProfile();
    else renderDash();
  }

  $("#newBtn").appendChild(icon("plus", 16));
  $("#newBtn").appendChild(document.createTextNode("New invoice"));
  $("#newBtn").addEventListener("click", newAndOpen);
  $("#navDash").addEventListener("click", function () { go("dash"); });
  $("#navProfile").addEventListener("click", function () { go("profile"); });
  $("#brand").addEventListener("click", function () { if (user && (view === "dash" || view === "edit" || view === "profile")) go("dash"); });
  $("#themeBtn").addEventListener("click", function () { store.theme = isDark() ? "light" : "dark"; saveTheme(); applyTheme(); });
  $("#logoutBtn").addEventListener("click", function () {
    var p = view === "edit" ? leaveEditor() : Promise.resolve();
    Promise.resolve(p).then(flushAll).then(function () { return sb.auth.signOut(); });
  });
  document.addEventListener("visibilitychange", function () { if (document.hidden && user) flushAll(); });

  applyTheme();
  if (!window.supabase || !window.supabase.createClient) {
    errorText = "The app could not load a required file. Check your internet connection and reload.";
    view = "error"; render();
  } else {
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    render();
    sb.auth.onAuthStateChange(function (ev, session) { handleSession(session); });
    sb.auth.getSession().then(function (r) { handleSession(r && r.data ? r.data.session : null); },
      function () { handleSession(null); });
  }
})();
